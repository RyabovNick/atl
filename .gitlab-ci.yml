# Tag vX.Y.Z to release: binaries go to this project's Generic Package
# Registry and a GitLab release links them, which is what install.sh downloads.
# Release builds use the URLs in defaults.go; CI/CD variables JIRA_DEFAULT_URL
# and CONFLUENCE_DEFAULT_URL override them, since make reads them from the
# environment.

stages: [test, build, release]

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS
      when: never
    - if: $CI_COMMIT_BRANCH
    - if: $CI_COMMIT_TAG

variables:
  GOPATH: $CI_PROJECT_DIR/.go
  GOFLAGS: -mod=readonly

.go:
  image: golang:1.27
  cache:
    key:
      files: [go.sum]
    paths: [.go/pkg/mod/]

.release-tag:
  rules:
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/

test:
  extends: .go
  stage: test
  script:
    - test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
    - go vet ./...
    - go test -race -cover ./...

build:
  extends: [.go, .release-tag]
  stage: build
  script:
    - make dist VERSION="$CI_COMMIT_TAG"
    # The generic package version is the tag without its leading v.
    - echo "PACKAGE_VERSION=${CI_COMMIT_TAG#v}" > release.env
    - |
      base="${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/atl/${CI_COMMIT_TAG#v}"
      for f in dist/*; do
        curl --fail-with-body -sS --header "JOB-TOKEN: ${CI_JOB_TOKEN}" \
          --upload-file "$f" "${base}/$(basename "$f")"
      done
  artifacts:
    paths: [dist/]
    reports:
      dotenv: release.env
    expire_in: 30 days

release:
  extends: .release-tag
  stage: release
  image: registry.gitlab.com/gitlab-org/release-cli:v0.18.0
  needs: [build]
  script:
    - echo "Releasing $CI_COMMIT_TAG"
  release:
    tag_name: $CI_COMMIT_TAG
    name: atl $CI_COMMIT_TAG
    description: |
      Linux and macOS: run install.sh. Windows: download atl-windows-amd64.exe,
      rename it to atl.exe and run `atl.exe install`. Verify downloads against SHA256SUMS.
    assets:
      links:
        - name: atl-linux-amd64
          url: ${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/atl/${PACKAGE_VERSION}/atl-linux-amd64
          link_type: package
        - name: atl-linux-arm64
          url: ${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/atl/${PACKAGE_VERSION}/atl-linux-arm64
          link_type: package
        - name: atl-darwin-amd64
          url: ${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/atl/${PACKAGE_VERSION}/atl-darwin-amd64
          link_type: package
        - name: atl-darwin-arm64
          url: ${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/atl/${PACKAGE_VERSION}/atl-darwin-arm64
          link_type: package
        - name: atl-windows-amd64.exe
          url: ${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/atl/${PACKAGE_VERSION}/atl-windows-amd64.exe
          link_type: package
        - name: atl-windows-arm64.exe
          url: ${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/atl/${PACKAGE_VERSION}/atl-windows-arm64.exe
          link_type: package
        - name: SHA256SUMS
          url: ${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/atl/${PACKAGE_VERSION}/SHA256SUMS
          link_type: package

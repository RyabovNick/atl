# Copy to ~/.config/atl/config.ini and chmod 600 it; atl refuses a file others can read.
# Data Center tokens are per application, so Jira and Confluence each need their own.
# JIRA_URL, JIRA_API_TOKEN, JIRA_USERNAME and the CONFLUENCE_* equivalents
# override these values, and with URL and token set the file is optional.
# `atl doctor` shows which source each value came from and tests the login.

[jira]
url = https://jira.example.com
token = paste-jira-token-here
# Bearer by default; setting a username switches to basic auth (username + token).
# username = you
# auth = bearer        (forces one mode: bearer or basic)
# ca_bundle = /path/to/ca.pem
# timeout = 30

[confluence]
# Include the context path if Confluence lives under one, e.g. https://example.com/wiki
url = https://confluence.example.com
token = paste-confluence-token-here
